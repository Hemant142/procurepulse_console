<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProcurePulse Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --black:#0B0D12;
    --white:#FFFFFF;
    --blue:#1D4FE0;
    --blue-dark:#12318C;
    --blue-tint:#EAF0FE;
    --yellow:#FFC300;
    --line:#E4E7EE;
    --muted:#666B78;
    --paper:#F7F8FB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--white);color:var(--black);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 32px 96px;}

  /* top bar */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:26px 0;border-bottom:2px solid var(--black);
  }
  .topbar .logo{height:72px;width:auto;display:block;order:2;}
  .topbar .mark{
    font-family:'Sora',sans-serif;font-weight:700;font-size:24px;letter-spacing:.2px;order:1;
  }
  .topbar .mark span{color:var(--blue);}

  /* elevator pitch banner */
  .pitch{
    background:var(--black);color:var(--white);border-radius:12px;
    padding:20px 26px;margin:28px 0 40px;position:relative;overflow:hidden;
  }
  .pitch::after{
    content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;
    background:var(--yellow);border-radius:50%;opacity:.9;filter:blur(0px);
  }
  .pitch::before{
    content:"";position:absolute;bottom:-60px;left:-30px;width:120px;height:120px;
    background:var(--blue);border-radius:50%;opacity:.55;
  }
  .pitch-inner{position:relative;z-index:1;max-width:640px;}
  .pitch-tag{
    font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--yellow);margin:0 0 12px;
  }
  .pitch p{font-family:'Sora',sans-serif;font-size:14.5px;line-height:1.55;font-weight:500;margin:0;}
  .pitch p b{color:var(--yellow);font-weight:600;}

  h2.section-head{
    font-family:'Sora',sans-serif;font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
    color:var(--blue);margin:0 0 4px;display:flex;align-items:center;gap:8px;
  }
  h2.section-head .num{
    width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--white);
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;
  }
  .section-title{font-family:'Sora',sans-serif;font-size:22px;font-weight:600;margin:0 0 8px;}
  .section-desc{font-size:14px;color:var(--muted);margin:0 0 24px;max-width:600px;line-height:1.6;}

  section.block{padding:44px 0;border-bottom:1px solid var(--line);}
  section.block:last-of-type{border-bottom:none;}

  /* progress */
  .progress-wrap{margin:0 0 26px;max-width:600px;}
  .progress-track{height:5px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--blue);border-radius:4px;width:0%;transition:width .4s ease;}
  .progress-label{font-size:12px;color:var(--muted);margin-top:8px;font-weight:500;}

  /* learn rows */
  .row{
    display:grid;grid-template-columns:40px 1fr auto;align-items:center;
    gap:16px;padding:16px 12px;border-radius:10px;transition:background .15s ease;
    border:1px solid transparent;
  }
  .row:not(.locked):hover{background:var(--paper);border-color:var(--line);}
  .row + .row{margin-top:4px;}
  .row .idx{
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--muted);border:1.5px solid var(--line);font-variant-numeric:tabular-nums;
    transition:all .2s ease;font-weight:600;
  }
  .row.done .idx{background:var(--blue);border-color:var(--blue);color:#fff;}
  .row .body{display:flex;align-items:center;gap:12px;}
  .row .body i{font-size:20px;color:var(--blue);flex-shrink:0;}
  .row.locked .body i{color:var(--muted);}
  .row .body p.t{margin:0;font-size:15px;font-weight:600;}
  .row .body p.d{margin:3px 0 0;font-size:13px;color:var(--muted);}
  .row a.go{
    font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;border:1.5px solid var(--blue);
    padding:8px 16px;border-radius:7px;white-space:nowrap;transition:all .15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .row a.go:hover{background:var(--blue);color:#fff;transform:translateY(-1px);}
  .row.done a.go{color:var(--black);border-color:var(--line);}
  .row.done a.go:hover{background:var(--black);color:#fff;border-color:var(--black);}
  .row.locked a.go{color:var(--muted);border-color:var(--line);pointer-events:none;background:none;}
  .row.locked p.t{color:var(--muted);}

  /* sell tabs */
  .sell-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .sell-tab{
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:10px 18px;
    border-radius:999px;border:1.5px solid var(--line);background:var(--white);color:var(--muted);
    cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:8px;
  }
  .sell-tab i{font-size:15px;}
  .sell-tab:hover{border-color:var(--blue);color:var(--blue);}
  .sell-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .sell-panel{display:none;animation:fade .25s ease;}
  .sell-panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .deck-card{
    background:var(--paper);border:1.5px solid var(--line);border-radius:14px;
    padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:24px;
    transition:all .18s ease;max-width:620px;
  }
  .deck-card:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(29,79,224,0.08);}
  .deck-card .body{display:flex;align-items:center;gap:16px;}
  .deck-card .icon-wrap{
    width:48px;height:48px;border-radius:12px;background:var(--blue-tint);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  }
  .deck-card p.t{margin:0;font-size:16px;font-weight:600;}
  .deck-card p.d{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:400px;line-height:1.5;}
  .deck-card a.go{
    font-size:13.5px;font-weight:600;color:var(--black);background:var(--yellow);text-decoration:none;
    padding:10px 20px;border-radius:8px;white-space:nowrap;transition:all .15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .deck-card a.go:hover{background:var(--black);color:#fff;transform:translateY(-1px);}

  .footer-note{
    margin-top:12px;padding:20px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7;
  }
  .footer-note b{color:var(--black);font-weight:600;}
  .footer-note code{background:var(--paper);padding:1px 5px;border-radius:4px;border:1px solid var(--line);}
</style>
</head>

<script>
/* ---------- EDIT LINKS HERE ---------- */
const LINKS = {
  pitch: "ProcurePulse gives procurement and finance teams one connected view across contracts, POs, goods receipts and invoices, so three-way-match gaps, maverick spend and off-contract buying surface automatically instead of hiding in the seams between systems. It replaces manual invoice verification with automated matching and exception routing, and scores every business unit on a maturity framework with next steps attached. <b>The leakage was always there. Now the whole chain is visible.</b>",
  learn: [
    { icon:'ti-player-play', title:'Product demo walkthrough', desc:'18-minute recorded video, screen-share format', cta:'Watch', url:'https://polestarllp-my.sharepoint.com/personal/siddharth_poddar_polestaranalytics_com/_layouts/15/stream.aspx?id=%2Fpersonal%2Fsiddharth%5Fpoddar%5Fpolestaranalytics%5Fcom%2FDocuments%2FVideos%2FClipchamp%2FVideo%20Project%207%2FExports%2FProcurePulse%20demo%20%20V2%2Emp4&referrer=StreamWebApp%2EWeb&referrerScenario=AddressBarCopied%2Eview%2E5dcce938%2Da797%2D401f%2Dbe5e%2Db500f2f46851&ct=1790180309066&or=Teams%2DHL&ga=1&LOF=1' },
    { icon:'ti-file-text',   title:'Training document', desc:'Self-paced walkthrough of the product, module by module', cta:'Open', url:'file:///C:/Users/sarmistha.sutar/Downloads/ProcurePulse_Intro.html' },
    { icon:'ti-help-circle', title:'Sales Simulation Game', desc:'Made for the sales, GTM and demand-gen teams.', cta:'Start', url:'https://polestarllp-my.sharepoint.com/:u:/g/personal/himanshi_pahwa_polestaranalytics_com/IQAUs0Euyi-ORbxWD3L3t-tMAfKjL26yoUwmxNQf2JpdgEE?e=wLZLvs' },
    { icon:'ti-certificate', title:'Pre-Sales Simulation Game', desc:'To be completed by the pre-sales team.', cta:'Start', url:'https://polestarllp-my.sharepoint.com/:u:/g/personal/himanshi_pahwa_polestaranalytics_com/IQB51OWvQ8V5TaeMgNI65Fm0AZIE9giElQSelvaGpTe6mIU?e=5TN5YE' }
  ],
  sell: [
    { key:'customer', label:'Sell to Customer', icon:'ti-briefcase',
      title:'Client sales play', desc:'Solution overview built for a customer conversation.', url:'https://onedrive.live.com/personal/07DF4535EA7BBD72/_layouts/15/Doc.aspx?sourcedoc=%7B224CAB8C-2B0D-4C4B-BCD8-B1A3CD87CB05%7D&file=ProcurePulse-Sales-Play%20Client%20Version%20.pptx&action=edit&mobileredirect=true' },
    { key:'databricks', label:'Sell to Databricks', icon:'ti-database',
      title:'Databricks-aligned deck', desc:'Positioning for partner conversations with Databricks.', url:'https://polestarllp-my.sharepoint.com/:p:/g/personal/nupur_jain_polestaranalytics_com/IQDxPeq9hU_sSpLRedNnwmWZAfglY_j2yzz_OvBVHt3PTJY?e=J10gkc&wdExp=TEAMS-TREATMENT&web=1&isSPOFile=1&ovuser=5c979e27-0063-4697-891c-ba85b3eddf83%2Csarmistha.sutar%40polestaranalytics.com&clickparams=eyJBcHBOYW1lIjoiVGVhbXMtRGVza3RvcCIsIkFwcFZlcnNpb24iOiI0OS8yNjA4MTMxOTMyMSJ9' },

  ]
};
/* -------------------------------------- */

document.getElementById('pitch-text').innerHTML = LINKS.pitch;

let completed = [false, false, false, false];

function renderLearn(){
  const container = document.getElementById('learn-rows');
  container.innerHTML = '';
  LINKS.learn.forEach(function(item, i){
    const isDone = completed[i];
    const row = document.createElement('div');
    row.className = 'row' + (isDone ? ' done' : '');
    row.innerHTML =
      '<div class="idx">' + (isDone ? '<i class="ti ti-check" style="font-size:13px;"></i>' : String(i+1).padStart(2,'0')) + '</div>' +
      '<div class="body"><i class="ti ' + item.icon + '"></i><div><p class="t">' + item.title + '</p><p class="d">' + item.desc + '</p></div></div>' +
      '<a class="go" href="' + item.url + '" data-idx="' + i + '" target="_blank" rel="noopener">' +
        (isDone ? 'Revisit' : item.cta) +
        '<i class="ti ti-arrow-right" style="font-size:13px;"></i>' +
      '</a>';
    container.appendChild(row);
  });

  container.querySelectorAll('a.go').forEach(function(a){
    a.addEventListener('click', function(e){
      const idx = parseInt(a.dataset.idx, 10);
      if (LINKS.learn[idx].url === '#') e.preventDefault();
      if (!completed[idx]) {
        completed[idx] = true;
        updateProgress();
        renderLearn();
      }
    });
  });
}

function updateProgress(){
  const done = completed.filter(Boolean).length;
  document.getElementById('progress-fill').style.width = (done / completed.length * 100) + '%';
  document.getElementById('progress-label').textContent = done + ' of ' + completed.length + ' opened';
}

function renderSell(){
  const tabsEl = document.getElementById('sell-tabs');
  const panelsEl = document.getElementById('sell-panels');
  tabsEl.innerHTML = '';
  panelsEl.innerHTML = '';
  LINKS.sell.forEach(function(item, i){
    const tab = document.createElement('button');
    tab.className = 'sell-tab' + (i === 0 ? ' active' : '');
    tab.dataset.key = item.key;
    tab.innerHTML = '<i class="ti ' + item.icon + '"></i>' + item.label;
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'sell-panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + item.key;
    panel.innerHTML =
      '<div class="deck-card"><div class="body">' +
      '<div><p class="t">' + item.title + '</p><p class="d">' + item.desc + '</p></div></div>' +
      '<a class="go" href="' + item.url + '" target="_blank" rel="noopener">Open deck<i class="ti ti-arrow-right" style="font-size:13px;"></i></a></div>';
    panelsEl.appendChild(panel);
  });

  tabsEl.querySelectorAll('.sell-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      tabsEl.querySelectorAll('.sell-tab').forEach(function(t){t.classList.remove('active');});
      panelsEl.querySelectorAll('.sell-panel').forEach(function(p){p.classList.remove('active');});
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.key).classList.add('active');
    });
  });
}

renderLearn();
renderSell();
updateProgress();
</script>
